services:
  - type: web
    name: ckr-wwdc
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TRUEWALLET_PHONE
        sync: false
      # Heart farm proxy. Must authenticate by username/password from any
      # source IP — this plan has no static outbound IP to put on an allowlist.
      - key: HEART_PROXY_URL
        sync: false
